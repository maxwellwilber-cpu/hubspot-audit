name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        # The package itself has no dependencies. pytest is only for the suite.
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Run the demo and assert every planted defect is still caught
        run: python examples/demo.py
